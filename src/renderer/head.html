<head>
    <meta charset="UTF-8" />
    <title>Edge Automation Test Stand</title>

    <style>
        body {
        
          font-family: sans-serif;
        }
    
        .container {
          display: flex;
          height: 70vh;
        }
    
        .left-pane {
          flex: 1;
          background-color: #f2f2f2;
          border-right: 2px solid #ccc;
          border: 2px inset #ccc;
        }
    
        .right-pane {
          flex: 3;        
          background-color: #111;
          color: #0f0;
          font-family: monospace;
          overflow-y: auto;
        }
    
        ul {
          justify-content: left;
          width: 100%;  
        }
    
        li:hover {
          background-color: #ddd;
        }

        .test-status-container {
          width: 40%;
          display: flex;
          justify-content: center; /* horizontal */
          align-items: center;     /* vertical */                  
          border: 2px inset #ccc;
          border-radius: 4px;
          font-size: 50px;
          color: #e0f7fa;
        }
        .list-item {
          display: flex; /* Allow content and icon on same line */
          justify-content: left; /* Push text and icon apart */
          align-items: center; /* Center vertically */
          padding: 5px 5px;
          cursor: pointer; /* Pointer cursor on hover */
          border-bottom: 1px solid #ddd; /* Optional: item divider */
          width: 100%;
        }
        .list-item.selected {
          background-color: #e0f7fa; /* Light blue background to simulate selection */
        }
      </style>
</head>
