<head>
    <meta charset="UTF-8" />
    <title>Edge Automation Test Stand</title>

    <style>
        body {
          font-family: sans-serif;
          height: 100%;
        }
    
        .content_wrapper {
          display: flex;
          flex-direction: column;
          height: 80%;
        }

        .top {          
          margin: 0;
          padding: 0;
          padding: 10px;      
        }

        .bottom {
          flex: 1;
          margin: 0;
          padding: 0;
        }

        .container{
          display: flex;
        }

        .left-pane {
          width: 25%;
          background-color: #f2f2f2;
          border-right: 2px solid #ccc;
          border: 2px inset #ccc;
          border-bottom-left-radius: 10px;
          border-top-left-radius: 10px;
          box-sizing: border-box;
          overflow: hidden; 
        }
    
        .right-pane {
          width: 75%;
          background-color: #111;
          color: #0f0;
          font-family: monospace;
          overflow-y: auto;
          box-sizing: border-box;
          border-bottom-right-radius: 10px;
          border-top-right-radius: 10px;
        }
    
        ul {
          margin: 0;
          padding: 0;
          list-style: none;   
          height: 100%;     
          width: 100%; 
          overflow-y: auto;       
        }
    
        li:hover {
          background-color: #ddd;
        }

        .test-status-container {
          width: 40%;
          display: flex;
          justify-content: center; /* horizontal */
          align-items: center;     /* vertical */                  
          border: 2px inset #ccc;
          border-radius: 4px;
          font-size: 50px;
          color: #e0f7fa;
        }
        .list-item {
          margin: 0;
          display: flex; /* Allow content and icon on same line */
          justify-content: space-between; /* Push text and icon apart */
          align-items: center; /* Center vertically */          
          cursor: pointer; /* Pointer cursor on hover */
          pointer-events: none;
          padding: 1%;
          border-bottom: 1px solid #ddd; /* Optional: item divider */
        }
        .list-item.selected {
          background-color: #e0f7fa; /* Light blue background to simulate selection */
        }
      </style>
</head>
